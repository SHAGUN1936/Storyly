<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-label="Storyly">
  <defs>
    <linearGradient id="storyly-photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="35%" stop-color="#FBCFE8"/>
      <stop offset="70%" stop-color="#DDD6FE"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="storyly-heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBCFE8"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="storyly-polaroid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <!-- Tilted polaroid -->
  <g transform="rotate(-5 24 24)">
    <!-- Polaroid backing -->
    <rect x="6" y="4" width="36" height="40" rx="4" fill="url(#storyly-polaroid)" stroke="#E2E8F0" stroke-width="0.5"/>

    <!-- Photo area -->
    <rect x="9" y="7" width="30" height="26" rx="2.5" fill="url(#storyly-photo)"/>

    <!-- Bold "S" brand glyph -->
    <text x="24" y="22" text-anchor="middle" dominant-baseline="central"
          font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="800"
          font-size="22" fill="#1E1B4B" style="letter-spacing:-0.04em">S</text>

    <!-- Mini heart sticker, bottom-right of the photo -->
    <g transform="translate(33 28) scale(0.20) translate(-24 -22)">
      <path d="M24 38 L8 22 Q3 16 8 11 Q13 6 18 11 L24 17 L30 11 Q35 6 40 11 Q45 16 40 22 Z"
            fill="url(#storyly-heart)" stroke="#FFFFFF" stroke-width="3"/>
    </g>

    <!-- Caption strip dots -->
    <circle cx="16" cy="39" r="0.9" fill="#CBD5E1"/>
    <circle cx="20" cy="39" r="0.9" fill="#CBD5E1"/>
    <circle cx="24" cy="39" r="0.9" fill="#CBD5E1"/>
  </g>

  <!-- Sparkle, top-right -->
  <path d="M41 3 L42.4 6.6 L46 8 L42.4 9.4 L41 13 L39.6 9.4 L36 8 L39.6 6.6 Z"
        fill="#FDE68A" stroke="#FFFFFF" stroke-width="0.6"/>
</svg>
